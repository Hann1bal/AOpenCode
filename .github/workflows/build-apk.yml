name: Build APK

on:
  workflow_dispatch:
    inputs:
      runtime_manifest:
        description: "Runtime manifest the app should read (sha256 + download URL for the backend binary)."
        required: false
        default: "https://github.com/Hann1bal/opencode-mesh/releases/download/fork-sync-dev/runtime.json"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Rolling release asset from the fork's fork-build workflow. Carries the
      # UpstreamSync module; the stock npm binary does not. The app reads this
      # at runtime instead of shipping the binary inside the APK.
      RUNTIME_MANIFEST: ${{ github.event.inputs.runtime_manifest || 'https://github.com/Hann1bal/opencode-mesh/releases/download/fork-sync-dev/runtime.json' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # The repo has no wrapper, so without this the runner's preinstalled Gradle
        # is used — 9.8.2 on ubuntu-latest, which AGP 8.7.3 rejects at
        # configuration time. Pin the version AGP 8.7.x is built against.
        with:
          gradle-version: "8.11.1"

      - name: Prepare backend assets
        run: bash scripts/prepare-assets.sh

      # The backend is downloaded at runtime now, so the old "is the bundled
      # file the fork build" check no longer applies. What still matters is
      # where the manifest points: one aimed at the stock npm binary would
      # install cleanly and silently lack UpstreamSync.
      - name: Verify the runtime source is the fork
        run: |
          if [ -f app/src/main/assets/runtime/opencode ]; then
            echo "::error::The backend is bundled into assets/runtime again."
            echo "::error::It must be downloaded at runtime or every update costs 324 MB."
            exit 1
          fi
          BODY="$(curl -fsSL "$RUNTIME_MANIFEST")"
          URL="$(printf '%s' "$BODY" | sed -n 's/.*"url": "\([^"]*\)".*/\1/p')"
          SHA="$(printf '%s' "$BODY" | sed -n 's/.*"sha256": "\([^"]*\)".*/\1/p')"
          echo "manifest url=$URL"
          echo "manifest sha256=$SHA"
          case "$URL" in
            *Hann1bal/opencode-mesh*) ;;
            *)
              echo "::error::Runtime manifest does not point at the fork: $URL"
              exit 1
              ;;
          esac
          if [ "${#SHA}" -ne 64 ]; then
            echo "::error::Runtime manifest sha256 is not a sha256: '$SHA'"
            exit 1
          fi
          echo "OK: runtime is fetched from the fork build"

      # Cheap source checks that gradle would also catch, but with an error line
      # in the annotation list instead of a log behind a sign-in wall. Each of
      # these corresponds to a build that was actually lost to CI before being
      # noticed locally.
      - name: Static source checks
        run: |
          python3 scripts/check-kotlin-escapes.py || exit 1
          python3 scripts/check-duplicate-funs.py || exit 1

      - name: Decode keystore (if provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        # GitHub hides raw logs behind a login on public repos, so mirror the
        # failure into the job summary, which is readable anonymously.
        run: |
          set +e
          # On a tag push the tag is the version, so the string the app reports
          # cannot drift from the release it came from. Otherwise fall back to the
          # VERSION file in the repo.
          # lintRelease first: NewApi violations compile fine and crash on the
          # device, so catching them here is the difference between a red build
          # and a user-facing NoSuchMethodError.
          GRADLE_ARGS="--no-daemon lintRelease assembleRelease"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PappVersion=${GITHUB_REF_NAME#v}"
          fi
          echo "version args: $GRADLE_ARGS"
          gradle $GRADLE_ARGS 2>&1 | tee /tmp/gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### assembleRelease failed (exit $code)"
              echo ""
              echo '```'
              grep -Ei '^(e: |w: |error: |FAILURE|> Task .*FAILED|What went wrong|\* What|\* Where|Caused by|Execution failed)' /tmp/gradle.log | tail -n 100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      # The whole point of moving the backend out of the APK is a small update.
      # If anything re-bundles it, fail here instead of shipping 324 MB again
      # and finding out from the download.
      - name: Check APK size
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          SIZE=$(stat -c%s "$APK")
          MB=$(( SIZE / 1048576 ))
          echo "APK: $APK = $MB MB"
          if [ "$MB" -gt 150 ]; then
            echo "::error::APK is $MB MB — the backend must not be bundled."
            exit 1
          fi
          echo "OK: $MB MB"

      # The job summary is React-rendered and not anonymously fetchable, so push the
      # raw log to a rolling prerelease asset: a plain URL, downloadable without auth.
      - name: Publish gradle log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/gradle.log ]; then
            # Gradle never ran — the failure was upstream of it (setup, assets,
            # keystore). Exiting quietly here would leave the PREVIOUS build's log
            # published under this rolling tag, which reads like a current
            # diagnosis of a bug that was already fixed. Always publish something
            # that describes this attempt.
            {
              echo "gradle did not run: the build failed before the assemble step."
              echo "commit: $GITHUB_SHA"
              echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "The real error is in the failing step of that run, not here."
            } > /tmp/gradle.log
          fi
          # R8 writes the exact keep/dontwarn rules it wanted into missing_rules.txt,
          # but that file dies with the runner. Fold it into the published log.
          MISSING=app/build/outputs/mapping/release/missing_rules.txt
          if [ -f "$MISSING" ]; then
            {
              echo ""
              echo "===== missing_rules.txt ====="
              cat "$MISSING"
            } >> /tmp/gradle.log
          fi
          gh release create apk-diag \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "APK build diagnostics" \
            --prerelease \
            --notes "Raw gradle log from the most recent failing APK build ($GITHUB_SHA)." \
            /tmp/gradle.log 2>/dev/null \
          || gh release upload apk-diag /tmp/gradle.log --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
