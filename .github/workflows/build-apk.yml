name: Build APK

on:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "opencode CLI version to bundle (ignored if fork_binary_url is set)"
        required: false
        default: "2.2.5"
      fork_binary_url:
        description: "Direct URL to a fork-built linux-arm64-musl opencode binary (with UpstreamSync). Leave empty for stock npm build."
        required: false
        default: "https://github.com/Hann1bal/opencode-mesh/releases/download/fork-sync-dev/opencode"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # The repo has no wrapper, so without this the runner's preinstalled Gradle
        # is used — 9.8.2 on ubuntu-latest, which AGP 8.7.3 rejects at
        # configuration time. Pin the version AGP 8.7.x is built against.
        with:
          gradle-version: "8.11.1"

      - name: Prepare backend assets
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.opencode_version || '2.2.5' }}
          OPENCODE_BINARY_URL: ${{ github.event.inputs.fork_binary_url || '' }}
        run: bash scripts/prepare-assets.sh

      - name: Decode keystore (if provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        # GitHub hides raw logs behind a login on public repos, so mirror the
        # failure into the job summary, which is readable anonymously.
        run: |
          set +e
          gradle --no-daemon assembleRelease 2>&1 | tee /tmp/gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### assembleRelease failed (exit $code)"
              echo ""
              echo '```'
              grep -Ei '^(e: |w: |error: |FAILURE|> Task .*FAILED|What went wrong|\* What|\* Where|Caused by|Execution failed)' /tmp/gradle.log | tail -n 100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      # The job summary is React-rendered and not anonymously fetchable, so push the
      # raw log to a rolling prerelease asset: a plain URL, downloadable without auth.
      - name: Publish gradle log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/gradle.log ] || exit 0
          gh release create apk-diag \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "APK build diagnostics" \
            --prerelease \
            --notes "Raw gradle log from the most recent failing APK build ($GITHUB_SHA)." \
            /tmp/gradle.log 2>/dev/null \
          || gh release upload apk-diag /tmp/gradle.log --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
