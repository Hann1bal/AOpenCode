name: Build APK

on:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: "opencode CLI version to bundle (ignored if fork_binary_url is set)"
        required: false
        default: "2.2.5"
      fork_binary_url:
        description: "Direct URL to a fork-built linux-arm64-musl opencode binary (with UpstreamSync). Leave empty for stock npm build."
        required: false
        default: "https://github.com/Hann1bal/opencode-mesh/releases/download/fork-sync-dev/opencode"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Rolling release asset from the fork's fork-build workflow. Contains the
      # UpstreamSync module; the stock npm binary does not.
      FORK_BINARY_URL: https://github.com/Hann1bal/opencode-mesh/releases/download/fork-sync-dev/opencode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # The repo has no wrapper, so without this the runner's preinstalled Gradle
        # is used — 9.8.2 on ubuntu-latest, which AGP 8.7.3 rejects at
        # configuration time. Pin the version AGP 8.7.x is built against.
        with:
          gradle-version: "8.11.1"

      - name: Prepare backend assets
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.opencode_version || '2.2.5' }}
          # github.event.inputs is only populated for workflow_dispatch. On a tag
          # push it is empty, which used to silently fall through to the stock npm
          # binary — an APK with no UpstreamSync. Default to the fork instead.
          OPENCODE_BINARY_URL: ${{ github.event.inputs.fork_binary_url || env.FORK_BINARY_URL }}
        run: bash scripts/prepare-assets.sh

      # A silent fallback to the stock binary produces an APK that installs and
      # runs but cannot sync, so assert the bundled file really is the fork build.
      - name: Verify bundled backend is the fork build
        run: |
          BUNDLED=app/src/main/assets/runtime/opencode
          BUNDLED_SIZE=$(stat -c%s "$BUNDLED")
          FORK_SIZE=$(curl -sIL "$FORK_BINARY_URL" | tr -d '\r' \
            | awk 'tolower($1)=="content-length:" {v=$2} END {print v}')
          echo "bundled=$BUNDLED_SIZE fork=$FORK_SIZE"
          if [ -z "$FORK_SIZE" ]; then
            echo "::error::Could not read the fork binary size from $FORK_BINARY_URL"
            exit 1
          fi
          if [ "$BUNDLED_SIZE" != "$FORK_SIZE" ]; then
            echo "::error::Bundled backend is $BUNDLED_SIZE bytes but the fork binary is $FORK_SIZE."
            echo "::error::That is the stock npm build: live session sharing would be missing."
            exit 1
          fi
          echo "OK: bundled backend matches the fork binary ($FORK_SIZE bytes)"

      - name: Decode keystore (if provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        # GitHub hides raw logs behind a login on public repos, so mirror the
        # failure into the job summary, which is readable anonymously.
        run: |
          set +e
          # On a tag push the tag is the version, so the string the app reports
          # cannot drift from the release it came from. Otherwise fall back to the
          # VERSION file in the repo.
          GRADLE_ARGS="--no-daemon assembleRelease"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PappVersion=${GITHUB_REF_NAME#v}"
          fi
          echo "version args: $GRADLE_ARGS"
          gradle $GRADLE_ARGS 2>&1 | tee /tmp/gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### assembleRelease failed (exit $code)"
              echo ""
              echo '```'
              grep -Ei '^(e: |w: |error: |FAILURE|> Task .*FAILED|What went wrong|\* What|\* Where|Caused by|Execution failed)' /tmp/gradle.log | tail -n 100
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      # The job summary is React-rendered and not anonymously fetchable, so push the
      # raw log to a rolling prerelease asset: a plain URL, downloadable without auth.
      - name: Publish gradle log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/gradle.log ]; then
            # Gradle never ran — the failure was upstream of it (setup, assets,
            # keystore). Exiting quietly here would leave the PREVIOUS build's log
            # published under this rolling tag, which reads like a current
            # diagnosis of a bug that was already fixed. Always publish something
            # that describes this attempt.
            {
              echo "gradle did not run: the build failed before the assemble step."
              echo "commit: $GITHUB_SHA"
              echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "The real error is in the failing step of that run, not here."
            } > /tmp/gradle.log
          fi
          # R8 writes the exact keep/dontwarn rules it wanted into missing_rules.txt,
          # but that file dies with the runner. Fold it into the published log.
          MISSING=app/build/outputs/mapping/release/missing_rules.txt
          if [ -f "$MISSING" ]; then
            {
              echo ""
              echo "===== missing_rules.txt ====="
              cat "$MISSING"
            } >> /tmp/gradle.log
          fi
          gh release create apk-diag \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "APK build diagnostics" \
            --prerelease \
            --notes "Raw gradle log from the most recent failing APK build ($GITHUB_SHA)." \
            /tmp/gradle.log 2>/dev/null \
          || gh release upload apk-diag /tmp/gradle.log --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
